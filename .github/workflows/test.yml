name: Test Bruno sur les conteneurs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests with docker
        run: |
          chmod +x run-docker.sh
          ./run-docker.sh build test
