# ecodrop + postgresql ; utile pour les tests CI / démo
# network_mode: host car Podman 4.3.1 rootless (slirp4netns) ne résout pas
# les noms de service entre conteneurs sur un réseau bridge (pas d'aardvark-dns).
# Les deux conteneurs partagent le réseau de la machine hôte.

services:
  ecodrop:
    build: .
    network_mode: host
    depends_on:
      - ecodrop-db
    command: /bin/bash -c "sleep 10 && catalina.sh run"
    environment:
      - DB_HOST=127.0.0.1

  ecodrop-db:
    image: postgres:15-alpine
    network_mode: host
    environment:
      - POSTGRES_USER=baptistelavogiezetu
      - POSTGRES_PASSWORD=jeanjean
      - POSTGRES_DB=but2
    volumes:
    # initialisée avec le script init.sql
    # idéalement avant de relancer on fait podman-compose down -v pour que le init.sql se refasse.
    # Les tests modifieront la base de façon déterministe donc cela permet l'idempotence.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

