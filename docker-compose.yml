# ecodrop + postgresql ; utile pour les tests CI

services:
  ecodrop:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - psqlserv
    networks:
      - ecodrop-net
    environment:
      - DB_HOST=ecodrop-db

  psqlserv:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=baptistelavogiezetu
      - POSTGRES_PASSWORD=jeanjean
      - POSTGRES_DB=but2
    networks:
      ecodrop-net:
        aliases:
          - ecodrop-db
    volumes:
    # initialisée avec le script init.sql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

networks:
  ecodrop-net:
    driver: bridge

